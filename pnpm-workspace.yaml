packages:
  - "apps/*"
  - "packages/*"
  - "functions"
  - "firebase"

# Install scripts are denied by default. Only these three are permitted, each
# a first-party build dependency that cannot function without its script:
#   esbuild        — links the platform-native binary; vitest needs it
#   @firebase/util — official Firebase SDK package
#   protobufjs     — generates its runtime; Firestore's gRPC layer needs it
# Nothing else in the tree may execute code at install time.
allowBuilds:
  esbuild: true
  "@firebase/util": true
  protobufjs: true

onlyBuiltDependencies:
  - esbuild
  - "@firebase/util"
  - protobufjs
