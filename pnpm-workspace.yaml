packages:
  - "apps/*"
  - "packages/*"
  - "functions"
  - "firebase"

# ── Dependency overrides ────────────────────────────────────────────────────
# jose is held at 5.x because firebase-admin depends on jwks-rsa@4, which does
# `const jose = require('jose')`. jose 6 is ESM-only — "type": "module" with no
# CommonJS build — so that require throws ERR_REQUIRE_ESM on Vercel's Node
# runtime and EVERY /api/auth/* route answers 500. NN could not sign anyone in.
# It does not reproduce locally, which is why it was only found by reading the
# deployed function's own logs.
#
# jwks-rsa uses exactly two jose APIs, importJWK and exportSPKI, and both exist
# in jose 5 — so this narrows the surface rather than changing behaviour.
# Remove it once firebase-admin's chain can be required from CommonJS.
overrides:
  jose: "^5.10.0"

# ── Install-script policy ───────────────────────────────────────────────────
# No dependency is permitted to execute code at install time. Each script
# below was read in full and explicitly DECLINED; the whole repository was
# then reinstalled with none of them running and the complete test suite
# (151 tests) plus the production build were verified to pass.
#
#   esbuild        install.js — replaces a JS shim with the native binary as an
#                  OPTIMISATION. The real x86_64 binary already arrives through
#                  optionalDependencies (@esbuild/darwin-x64), and the shim
#                  spawns it correctly. The script's other branch downloads
#                  over the network, which we never want. Declined.
#
#   @firebase/util postinstall.js — writes a config file from the
#                  FIREBASE_WEBAPP_CONFIG environment variable, which Firebase
#                  App Hosting injects at build time. That variable is unset
#                  here, so the script is a no-op. Revisit only if App Hosting
#                  build-time config is ever needed. Declined.
#
#   protobufjs     scripts/postinstall.js — prints a version-scheme warning to
#                  stderr and nothing else. Purely advisory. Declined.
#
# Re-review before changing any entry to true.
allowBuilds:
  esbuild: false
  "@firebase/util": false
  protobufjs: false
