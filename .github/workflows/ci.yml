name: NN CI

on:
  push:
    branches:
      - main
      - "gt/**"
      - "design/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nn-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Firebase CLI
        run: npm install --global --no-audit --no-fund firebase-tools@15.27.0

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and unit tests
        run: pnpm check

      - name: Build Next.js application
        run: pnpm --filter @nn/web build
